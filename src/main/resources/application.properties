
# DataSource personalizado
spring.datasource.driver.class=org.postgresql.Driver
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5434/prueba}
spring.datasource.username=${DB_USUARIO:postgres}
# Sin valor por defecto: la contraseña de la BD solo vive en la variable de entorno
spring.datasource.password=${DB_CLAVE}
spring.jpa.hibernate.ddl-auto=none

# Flyway
spring.flyway.enabled=false
spring.flyway.locations=classpath:db/migration
spring.flyway.table=flyway_schema_history
spring.flyway.schemas=public

# GestoPago
gestopago.auth.url=https://gestopago.portalventas.net
gestopago.auth.id-distribuidor=83
gestopago.auth.codigo-dispositivo=GPS83-TPV-17
# La contraseña NO va en el código: se lee de la variable de entorno GESTOPAGO_PASSWORD
gestopago.auth.password=${GESTOPAGO_PASSWORD:}

# Intervalo (3600000 = 1 hora)
gestopago.auth.refresh-rate-ms=3600000

spring.cloud.config.enabled=false
spring.cloud.config.import-check.enabled=false

logging.level.root=INFO
logging.level.com.proyecto.servicios=INFO

# API
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
server.port=${PORT:8081}
# URL (localhost)
openapi.url.dev=http://localhost:8081
openapi.description.dev=Local Development Server

# Onboarding
# Saldo con el que el sistema abre automáticamente toda cuenta nueva
app.cuenta.saldo-inicial=0.00
# Límite de sesión (minutos de inactividad)
app.login.session-timeout-minutes=5

# Llave AES para cifrar dato biométrico, token de sesión y token Bearer de GestoPago guardado en BD
# Llave AES-256 en Base64. NUNCA en el repositorio: variable de entorno APP_AES_KEY
# (generarla con: openssl rand -base64 32). Sin ella la aplicación no arranca.
app.seguridad.aes-key=${APP_AES_KEY}

# --- Pagos con GestoPago ---
gestopago.products.path=/sistema/service/getProductList.do
# ASUMIDO (no hay documentación): ajustar cuando el profesor entregue la especificación
gestopago.tx.path=/sistema/service/sendTx.do
gestopago.consulta.path=/sistema/service/consultaTx.do
# Código de respuesta que significa "pago aplicado"
gestopago.tx.codigo-exito=0
# Códigos que significan "en proceso" (separados por coma); vacío = ninguno
gestopago.tx.codigos-pendientes=
# Códigos de la consulta que significan "el proveedor NO aplicó la operación" (separados por coma)
gestopago.consulta.codigos-no-aplicada=
gestopago.tx.upc=
gestopago.tx.zona-horaria=America/Mexico_City

# Tiempos de espera: un timeout NO se interpreta como pago fallido (queda por conciliar). Feign no reintenta.
spring.cloud.openfeign.client.config.default.connect-timeout=5000
spring.cloud.openfeign.client.config.default.read-timeout=20000
spring.cloud.openfeign.client.config.default.logger-level=none

# Pago idéntico (misma cuenta, producto, destino y monto) dentro de esta ventana se rechaza como duplicado
app.pagos.ventana-duplicados-segundos=60

# Conciliación de pagos sin resultado final (la espera debe ser mayor al read-timeout)
app.pagos.conciliacion.activa=true
app.pagos.conciliacion.intervalo-ms=60000
app.pagos.conciliacion.inicio-ms=30000
app.pagos.conciliacion.espera-segundos=120
app.pagos.conciliacion.max-intentos=10
app.pagos.conciliacion.tamano-lote=20

# 2FA propio para autorizar pagos
app.pagos.2fa.vigencia-minutos=5
app.pagos.2fa.max-intentos=3
# SOLO práctica (PAGOS_2FA_DEVOLVER_CODIGO=true): devuelve el código en la respuesta.
# Por defecto false: el código se entregaría por otro canal (SMS/correo), nunca en la API
app.pagos.2fa.devolver-codigo=${PAGOS_2FA_DEVOLVER_CODIGO:false}

# --- Correo (aviso de movimientos). Gmail: usar CONTRASEÑA DE APLICACIÓN, no la normal ---
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USUARIO:}
spring.mail.password=${MAIL_CLAVE:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
app.notificaciones.activo=${NOTIFICACIONES_ACTIVO:false}
app.notificaciones.remitente=${MAIL_USUARIO:}
